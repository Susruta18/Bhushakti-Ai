services:
  - type: web
    name: bhushakti-ai-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DEVICE_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ML_API_URL
        value: https://bhushakti-ai-ml.onrender.com

  - type: web
    name: bhushakti-ai-ml
    runtime: docker
    rootDir: ml
    plan: free
    envVars:
      - key: PORT
        value: 8000

  - type: static_site
    name: bhushakti-ai-frontend
    rootDir: app
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    branch: main
    envVars:
      - key: VITE_API_BASE_URL
        value: https://bhushakti-ai-backend.onrender.com/api
      - key: VITE_APP_VERSION
        value: 1.0.0
      - key: VITE_APP_ENV
        value: production
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
