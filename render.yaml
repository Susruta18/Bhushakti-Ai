services:
  - type: web
    name: bhushakti-ai-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DEVICE_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ML_API_URL
        value: http://localhost:8000

  - type: web
    name: bhushakti-ai-ml
    runtime: docker
    rootDir: ml
    plan: free
    envVars:
      - key: PORT
        value: 8000
